# 整合測試用：一次啟動 前端(Nginx) + 後端 + Postgres
# 只有前端對外開放，後端與資料庫只在內部網路，瀏覽器透過前端的 /api 存取後端
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?請在 .env 設定 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pdfshare}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ${BACKEND_DIR:-./backed}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pdfshare}
      STORAGE_DIR: /data/storage
      # 前端與後端同源（經 Nginx 轉發），不需要開放跨來源
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    volumes:
      - backend_data:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ${FRONTEND_DIR:-./fronted}
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
  backend_data:
